<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>원료 주간 입고 계획</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --union-blue:#172F7C;
  --union-blue-dark:#10245F;
  --union-blue-soft:#EAF0FA;
  --union-red:#B02A3B;
  --paper:#FFFFFF;
  --surface:#FFFFFF;
  --surface-soft:#F7F8FB;
  --ink:#20242B;
  --ink-soft:#68707C;
  --line:#D9DEE8;
  --line-strong:#B9C1D0;
  --total-bg:#EEF2F9;
  --shadow:0 2px 8px rgba(23,47,124,.07);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans KR',sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;padding:0}
.wrap{width:min(1180px,calc(100% - 36px));margin:0 auto;flex:1;padding:30px 0 34px}
.corp-header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px;padding-bottom:17px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:18px;min-width:0}
.brand-logo{width:122px;height:auto;display:block}
.brand-divider{width:1px;height:28px;background:var(--line-strong)}
h1{font-weight:700;font-size:24px;letter-spacing:-.04em;margin:0;white-space:nowrap;color:var(--union-blue-dark)}
.week-nav{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
.week-nav button{
  background:#fff;border:1px solid var(--line-strong);color:var(--union-blue-dark);
  width:32px;height:32px;min-width:32px;border-radius:4px;cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center
}
.week-nav button:hover{background:var(--union-blue-soft);border-color:var(--union-blue)}
.week-label{font-size:13px;color:var(--ink-soft);white-space:nowrap;padding:0 5px}
.today-btn{font-size:12px;font-family:inherit;color:var(--union-blue);background:#fff;border:1px solid var(--line-strong);
  border-radius:4px;padding:7px 140px;min-width:auto;cursor:pointer;white-space:nowrap}
.today-btn:hover{background:var(--union-blue-soft);border-color:var(--union-blue)}
.view-links{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.view-links a{font-size:12px;color:var(--union-blue);border:1px solid #C5CEE0;border-radius:4px;padding:6px 11px;text-decoration:none;background:#fff}
.view-links a:hover{background:var(--union-blue-soft);border-color:var(--union-blue)}
.conn-status{font-size:11px;color:var(--ink-soft);margin-bottom:14px}
.conn-status.err{color:var(--union-red)}
.team-block{margin-bottom:28px;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--union-blue);
  border-radius:3px;padding:16px 16px 13px;box-shadow:var(--shadow);width:fit-content;max-width:100%}
.team-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
.team-title{font-size:17px;font-weight:700;margin:0;color:var(--union-blue-dark)}
table{width:auto;border-collapse:collapse;font-size:13px;table-layout:fixed}
th,td{border:1px solid var(--line);padding:7px 3px;text-align:center}
th{background:var(--union-blue-soft);font-weight:600;color:var(--union-blue-dark);font-size:12px;white-space:nowrap}
col.col-name{width:120px} col.col-day{width:48px} col.col-total{width:54px} col.col-weight{width:62px}
td.mat-name{text-align:left;padding:7px 4px 7px 10px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
td.mat-name .name-inner{display:flex;align-items:center;justify-content:space-between;gap:4px}
td.mat-name .name-text{overflow:hidden;text-overflow:ellipsis}
td.mat-name .mat-actions{display:flex;align-items:center;gap:3px;opacity:0;transition:opacity .12s;flex:0 0 auto}
tr:hover td.mat-name .mat-actions{opacity:1}
td.mat-name .mat-actions span{cursor:pointer;font-size:11px;color:var(--ink-soft);width:14px;text-align:center;line-height:1}
td.mat-name .mat-actions span:hover{color:var(--union-blue)}
td.mat-name .mat-actions span.del:hover{color:var(--union-red)}
td.mat-name .mat-actions span.disabled{opacity:.25;cursor:default}
td.cell{cursor:pointer;transition:background .12s;vertical-align:middle;font-size:12.5px}
td.cell:hover{background:#F3F6FB}
td.cell .v{display:block;line-height:1.5}
td.total{background:var(--total-bg);font-weight:700;color:var(--union-blue)}
td.weight{background:#F7F8FB;font-weight:600;color:var(--ink-soft);font-size:12px}
.add-row{display:flex;gap:8px;margin-top:10px}
.add-row input{flex:1;border:1px solid var(--line-strong);border-radius:4px;padding:8px 10px;font-size:13px;background:#fff;color:var(--ink)}
.add-btn-pill{border:1px solid #C5CEE0;background:var(--union-blue-soft);color:var(--union-blue);border-radius:4px;padding:7px 14px;font-size:13px;cursor:pointer;font-weight:600}
.add-btn-pill:hover{background:#DDE6F5}
.add-row .confirm-btn{border:none;background:var(--union-blue);color:#fff;border-radius:4px;padding:7px 14px;font-size:13px;cursor:pointer}
.add-row .confirm-btn:hover{background:var(--union-blue-dark)}
.overlay{position:fixed;inset:0;background:rgba(16,36,95,.28);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.show{display:flex}
.modal{background:#fff;border:1px solid var(--line);border-top:3px solid var(--union-blue);border-radius:4px;width:100%;max-width:340px;padding:22px;box-shadow:0 12px 45px rgba(16,36,95,.18)}
.modal h2{font-size:16px;margin:0 0 14px;color:var(--union-blue-dark)}
.entries{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.entry{display:flex;align-items:center;justify-content:space-between;background:var(--surface-soft);border-radius:3px;padding:6px 10px;font-size:13px}
.entry .x{cursor:pointer;color:var(--ink-soft);font-size:12px}.entry .x:hover{color:var(--union-red)}
.modal .add-line{display:flex;gap:8px}
.modal input[type=number]{flex:1;border:1px solid var(--line-strong);border-radius:4px;padding:8px 10px;font-size:14px;width:0}
.modal .row{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.modal button{border-radius:4px;padding:8px 16px;font-size:13px;cursor:pointer;border:none}
.btn-cancel{background:#fff;color:var(--ink-soft);border:1px solid var(--line-strong)!important}
.btn-add{background:var(--union-blue);color:#fff}
.corp-footer{height:30px;position:relative;margin-top:auto;overflow:hidden}
.corp-footer .footer-stripe{position:absolute;left:0;right:0;bottom:0;width:100%;height:17px;object-fit:fill;display:block}
.corp-footer .footer-stripe:after{display:none}
.corp-footer img{position:absolute;right:26px;bottom:13px;width:108px;height:auto;z-index:2}
@media(max-width:760px){
  .wrap{width:calc(100% - 24px);padding-top:20px}
  .corp-header{align-items:flex-start;flex-direction:column}
  .brand{gap:12px}.brand-logo{width:105px}.brand-divider{display:none}
  h1{font-size:20px}
  .team-block{width:100%;overflow-x:auto}
  table{font-size:11.5px}
  th,td{padding:5px 2px}
  col.col-name{width:105px} col.col-day{width:38px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="corp-header">
    <div class="brand"><img class="brand-logo" src="union-logo.png" alt="Union"><span class="brand-divider"></span><h1>원료 주간 입고 계획</h1></div>
    <div class="week-nav">
      <button id="prevBtn">‹</button>
      <span class="week-label" id="weekLabel"></span>
      <button id="nextBtn">›</button>
      <button class="today-btn" id="thisWeekBtn">이번주</button>
    </div>
  </div>
  <div class="conn-status" id="connStatus">Supabase 연결 확인 중...</div>
  <div class="view-links">
    <a href="team1-view.html" target="_blank">생산1팀 보기 페이지 열기 ↗</a>
    <a href="team2-view.html" target="_blank">생산2팀 보기 페이지 열기 ↗</a>
  </div>

  <div class="team-block" id="team1Block">
    <div class="team-title-row"><div class="team-title">생산1팀</div></div>
    <table id="team1Table"></table>
    <div class="add-row" id="team1AddRow"></div>
  </div>

  <div class="team-block" id="team2Block">
    <div class="team-title-row"><div class="team-title">생산2팀</div></div>
    <table id="team2Table"></table>
    <div class="add-row" id="team2AddRow"></div>
  </div>
</div>
<footer class="corp-footer"><img src="union-logo.png" alt="Union"><img class="footer-stripe" src="union-footer.png" alt=""></footer>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle"></h2>
    <div class="entries" id="entriesList"></div>
    <div class="add-line">
      <input type="number" id="valInput" placeholder="대수" min="0">
      <button class="btn-add" id="addValBtn">추가</button>
    </div>
    <div class="row">
      <button class="btn-cancel" id="closeModalBtn">닫기</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="app-shared.js"></script>
<script>
let materials = { team1: [], team2: [] };   // [{id,name,sort_order}]
let weekData  = { team1: {}, team2: {} };    // grouped entries: {material:{day:[{id,amount}]}}
let monday = getMonday(new Date());
let channels = [];

async function checkConnection(){
  const el = document.getElementById('connStatus');
  if(SUPABASE_URL.includes('YOUR-PROJECT') || SUPABASE_ANON_KEY.includes('YOUR-ANON')){
    el.textContent = 'supabase-config.js에 프로젝트 URL/anon key를 아직 입력하지 않았습니다.';
    el.classList.add('err');
    return false;
  }
  const { error } = await supabaseClient.from('materials').select('id').limit(1);
  if(error){
    el.textContent = 'Supabase 연결 실패: ' + error.message;
    el.classList.add('err');
    return false;
  }
  el.textContent = 'Supabase 연결됨 · 실시간 반영 중';
  el.classList.remove('err');
  return true;
}

async function loadTeam(team){
  materials[team] = await seedMaterialsIfEmpty(team);
  const rows = await fetchEntries(team, weekKey(monday));
  weekData[team] = groupEntries(rows);
}
async function loadAll(){
  await loadTeam('team1');
  await loadTeam('team2');
}

function renderHeader(){
  document.getElementById('weekLabel').textContent = weekLabelText(monday);
}

function renderTable(team){
  const table = document.getElementById(team+'Table');
  let html = '<colgroup><col class="col-name">';
  for(let i=0;i<6;i++) html += '<col class="col-day">';
  html += '<col class="col-total"><col class="col-weight"></colgroup>';
  html += '<thead><tr><th style="text-align:left;padding-left:10px;">원료명</th>';
  for(let i=0;i<6;i++){
    const d = dayDate(monday, i);
    html += `<th>${fmtDayOnly(d)}(${WEEKDAYS[i]})</th>`;
  }
  html += '<th>합계</th><th>중량</th></tr></thead><tbody>';

  const list = materials[team];
  list.forEach((m, idx) => {
    const mat = m.name;
    const upCls = idx === 0 ? 'disabled' : '';
    const downCls = idx === list.length-1 ? 'disabled' : '';
    html += `<tr><td class="mat-name">
      <div class="name-inner">
        <span class="name-text">${escapeHtml(mat)}</span>
        <span class="mat-actions">
          <span class="up ${upCls}" data-team="${team}" data-id="${m.id}">▲</span>
          <span class="down ${downCls}" data-team="${team}" data-id="${m.id}">▼</span>
          <span class="del" data-team="${team}" data-id="${m.id}" data-mat="${escapeHtml(mat)}">×</span>
        </span>
      </div>
    </td>`;
    for(let i=0;i<6;i++){
      const entriesForDay = (weekData[team][mat] && weekData[team][mat][i]) || [];
      const content = entriesForDay.length ? entriesForDay.map(e=>`<span class="v">${e.amount}</span>`).join('') : '';
      html += `<td class="cell" data-team="${team}" data-mat="${escapeHtml(mat)}" data-day="${i}">${content}</td>`;
    }
    const total = sumForMaterial(weekData[team], mat);
    const weight = total * weightFor(mat);
    html += `<td class="total">${total}</td><td class="weight">${weight}</td></tr>`;
  });

  html += '</tbody>';
  table.innerHTML = html;

  table.querySelectorAll('td.cell').forEach(td=>{
    td.addEventListener('click', ()=> openModal(td.dataset.team, td.dataset.mat, parseInt(td.dataset.day,10)));
  });
  table.querySelectorAll('.del').forEach(el=>{
    el.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!confirm(`"${el.dataset.mat}" 원료를 목록에서 삭제할까요?`)) return;
      await deleteMaterial(parseInt(el.dataset.id,10));
      await loadTeam(el.dataset.team);
      renderTable(el.dataset.team);
    });
  });
  table.querySelectorAll('.up, .down').forEach(el=>{
    el.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(el.classList.contains('disabled')) return;
      const team = el.dataset.team;
      const id = parseInt(el.dataset.id,10);
      const arr = materials[team];
      const i = arr.findIndex(m=>m.id===id);
      const dir = el.classList.contains('up') ? -1 : 1;
      const j = i + dir;
      if(j < 0 || j >= arr.length) return;
      const a = arr[i], b = arr[j];
      await updateMaterialOrder(a.id, b.sort_order);
      await updateMaterialOrder(b.id, a.sort_order);
      await loadTeam(team);
      renderTable(team);
    });
  });
}

function renderAll(){
  renderHeader();
  renderTable('team1');
  renderTable('team2');
  showAddButton('team1');
  showAddButton('team2');
}

// 원료 추가: 버튼만 보이다가 클릭 시 입력창으로 전환
function showAddButton(team){
  const row = document.getElementById(team+'AddRow');
  row.innerHTML = `<button class="add-btn-pill" data-team="${team}">+ 원료 추가</button>`;
  row.querySelector('.add-btn-pill').addEventListener('click', ()=> showAddInput(team));
}
function showAddInput(team){
  const row = document.getElementById(team+'AddRow');
  row.innerHTML = `
    <input type="text" id="${team}NewMat" placeholder="원료명 입력 (예: 소석회)">
    <button class="confirm-btn" data-team="${team}">추가</button>`;
  const input = document.getElementById(team+'NewMat');
  input.focus();
  row.querySelector('.confirm-btn').addEventListener('click', ()=> submitNewMaterial(team));
  input.addEventListener('keydown', (e)=>{
    if(e.key==='Enter') submitNewMaterial(team);
    if(e.key==='Escape') showAddButton(team);
  });
}
async function submitNewMaterial(team){
  const input = document.getElementById(team+'NewMat');
  const name = input.value.trim();
  if(!name){ showAddButton(team); return; }
  if(!materials[team].some(m=>m.name===name)){
    const nextOrder = materials[team].length ? Math.max(...materials[team].map(m=>m.sort_order))+1 : 0;
    await insertMaterial(team, name, nextOrder);
    await loadTeam(team);
    renderTable(team);
  }
  showAddButton(team);
}

// 입고량 입력 모달
let modalCtx = null;
const overlay = document.getElementById('overlay');
function openModal(team, mat, day){
  modalCtx = {team, mat, day};
  document.getElementById('modalTitle').textContent = `${mat} · ${WEEKDAYS[day]}요일 (${fmtDayOnly(dayDate(monday,day))}일)`;
  renderEntries();
  document.getElementById('valInput').value = '';
  overlay.classList.add('show');
  document.getElementById('valInput').focus();
}
function renderEntries(){
  const {team, mat, day} = modalCtx;
  const vals = (weekData[team][mat] && weekData[team][mat][day]) || [];
  const list = document.getElementById('entriesList');
  if(vals.length === 0){
    list.innerHTML = `<div style="font-size:12px;color:var(--ink-soft);">등록된 입고가 없습니다.</div>`;
    return;
  }
  list.innerHTML = vals.map(e=>
    `<div class="entry"><span>${e.amount}대</span><span class="x" data-id="${e.id}">삭제</span></div>`
  ).join('');
  list.querySelectorAll('.x').forEach(el=>{
    el.addEventListener('click', async ()=>{
      await deleteEntry(parseInt(el.dataset.id,10));
      await loadTeam(modalCtx.team);
      renderEntries();
      renderTable(modalCtx.team);
    });
  });
}
document.getElementById('addValBtn').addEventListener('click', async ()=>{
  const input = document.getElementById('valInput');
  const v = parseInt(input.value,10);
  if(isNaN(v) || v < 0) return;
  const {team, mat, day} = modalCtx;
  await insertEntry(team, weekKey(monday), mat, day, v);
  await loadTeam(team);
  renderTable(team);
  // 추가와 동시에 창 닫기
  overlay.classList.remove('show');
});
document.getElementById('valInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') document.getElementById('addValBtn').click();
});
document.getElementById('closeModalBtn').addEventListener('click', ()=> overlay.classList.remove('show'));
overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.classList.remove('show'); });

// 주간 이동
document.getElementById('prevBtn').addEventListener('click', async ()=>{
  monday.setDate(monday.getDate()-7);
  await loadAll(); renderAll();
});
document.getElementById('nextBtn').addEventListener('click', async ()=>{
  monday.setDate(monday.getDate()+7);
  await loadAll(); renderAll();
});
document.getElementById('thisWeekBtn').addEventListener('click', async ()=>{
  monday = getMonday(new Date());
  await loadAll(); renderAll();
});

(async function init(){
  const ok = await checkConnection();
  if(!ok) return;
  await loadAll();
  renderAll();
  channels.push(subscribeTeam('team1', async ()=>{ await loadTeam('team1'); renderTable('team1'); }));
  channels.push(subscribeTeam('team2', async ()=>{ await loadTeam('team2'); renderTable('team2'); }));
})();
</script>
</body>
</html>
