<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생산2팀 · 원료 주간 입고 계획</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --union-blue:#172F7C;--union-blue-dark:#10245F;--union-blue-soft:#EAF0FA;--union-red:#B02A3B;
  --paper:#fff;--ink:#20242B;--ink-soft:#68707C;--line:#D9DEE8;--line-strong:#B9C1D0;--total-bg:#EEF2F9;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;color:var(--ink);font-family:'Noto Sans KR',sans-serif}
body{min-height:100vh;display:flex;flex-direction:column}
.wrap{width:min(1180px,calc(100% - 36px));margin:0 auto;flex:1;padding:30px 0 34px}
.corp-header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px;padding-bottom:17px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:18px}.brand-logo{width:122px;height:auto;display:block}.brand-divider{width:1px;height:28px;background:var(--line-strong)}
h1{font-weight:700;font-size:24px;letter-spacing:-.04em;margin:0;color:var(--union-blue-dark)}
.sub{font-size:13px;color:var(--ink-soft);margin:-10px 0 9px 140px}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--union-blue);margin-right:6px}
.conn-status{font-size:11px;color:var(--ink-soft);margin-bottom:12px}.conn-status.err{color:var(--union-red)}
.week-nav{display:flex;align-items:center;gap:6px;margin-bottom:18px}
.week-nav button{border:1px solid var(--line-strong);background:#fff;color:var(--union-blue-dark);font-family:inherit;font-size:12px;font-weight:600;border-radius:3px;padding:6px 12px;cursor:pointer}
.week-nav button:hover{background:var(--union-blue-soft);border-color:var(--union-blue)}
.week-nav .today{background:var(--union-blue);border-color:var(--union-blue);color:#fff}
.week-nav .today:hover{background:var(--union-blue-dark)}
.team-block{background:#fff;border:1px solid var(--line);border-top:3px solid var(--union-blue);border-radius:3px;padding:16px 16px 14px;box-shadow:0 2px 8px rgba(23,47,124,.07);width:fit-content;max-width:100%}
table{width:auto;border-collapse:collapse;font-size:13px;table-layout:fixed}
th,td{border:1px solid var(--line);padding:7px 3px;text-align:center}
th{background:var(--union-blue-soft);font-weight:600;color:var(--union-blue-dark);font-size:12px;white-space:nowrap}
col.col-name{width:120px}col.col-day{width:48px}col.col-total{width:54px}
td.mat-name{text-align:left;padding:7px 4px 7px 10px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.cell{font-size:12.5px}td.cell .v{display:block;line-height:1.5}
td.total{background:var(--total-bg);font-weight:700;color:var(--union-blue)}
.empty{font-size:13px;color:var(--ink-soft)}
.corp-footer{height:48px;position:relative;margin-top:auto;overflow:hidden}
.corp-footer .footer-stripe{position:absolute;left:0;right:0;bottom:0;width:100%;height:17px;object-fit:fill;display:block}
.corp-footer .footer-stripe:after{display:none}
.corp-footer img{position:absolute;right:26px;bottom:13px;width:108px;height:auto;z-index:2}
@media(max-width:760px){
  .wrap{width:calc(100% - 24px);padding-top:20px}.corp-header{align-items:flex-start;flex-direction:column}
  .brand{gap:12px}.brand-logo{width:105px}.brand-divider{display:none}h1{font-size:20px}.sub{margin:0 0 9px}.week-nav{margin-bottom:14px}.week-nav button{padding:6px 10px}
  .team-block{width:100%;overflow-x:auto}table{font-size:11.5px}th,td{padding:5px 2px}
  col.col-name{width:105px}col.col-day{width:38px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="corp-header"><div class="brand"><img class="brand-logo" src="union-logo.png" alt="Union"><span class="brand-divider"></span><h1>원료 주간 입고 계획</h1></div></div>
  <div class="sub" id="weekLabel"></div>
  <div class="week-nav" aria-label="주간 이동">
    <button type="button" id="prevWeek">‹ 이전</button>
    <button type="button" id="defaultWeek" class="today">현재</button>
    <button type="button" id="nextWeek">다음 ›</button>
  </div>
  <div class="conn-status" id="connStatus"><span class="live-dot"></span>실시간 연결 중...</div>
  <div class="team-block">
    <div id="content"><div class="empty">불러오는 중...</div></div>
  </div>
</div>
<footer class="corp-footer"><img src="union-logo.png" alt="Union"><img class="footer-stripe" src="union-footer.png" alt=""></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="app-shared.js"></script>
<script>
const TEAM = 'team2';
let monday = getViewerDefaultMonday(new Date());

async function renderView(){
  document.getElementById('weekLabel').textContent = weekLabelText(monday);
  const materials = await fetchMaterials(TEAM);
  const rows = await fetchEntries(TEAM, weekKey(monday));
  const grouped = groupEntries(rows);

  let html = '<table><colgroup><col class="col-name">';
  for(let i=0;i<6;i++) html += '<col class="col-day">';
  html += '<col class="col-total"></colgroup><thead><tr><th style="text-align:left;padding-left:10px;">원료명</th>';
  for(let i=0;i<6;i++){
    const d = dayDate(monday, i);
    html += `<th>${fmtDayOnly(d)}(${WEEKDAYS[i]})</th>`;
  }
  html += '<th>합계</th></tr></thead><tbody>';

  materials.forEach(m=>{
    html += `<tr><td class="mat-name">${escapeHtml(m.name)}</td>`;
    for(let i=0;i<6;i++){
      const es = (grouped[m.name] && grouped[m.name][i]) || [];
      const c = es.length ? es.map(e=>`<span class="v">${e.amount}</span>`).join('') : '';
      html += `<td class="cell">${c}</td>`;
    }
    html += `<td class="total">${sumForMaterial(grouped, m.name)}</td></tr>`;
  });
  html += '</tbody></table>';
  document.getElementById('content').innerHTML = html;
}

document.getElementById('prevWeek').addEventListener('click', () => {
  monday = shiftWeek(monday, -1);
  renderView();
});
document.getElementById('nextWeek').addEventListener('click', () => {
  monday = shiftWeek(monday, 1);
  renderView();
});
document.getElementById('defaultWeek').addEventListener('click', () => {
  monday = getViewerDefaultMonday(new Date());
  renderView();
});

(async function init(){
  const status = document.getElementById('connStatus');
  if(SUPABASE_URL.includes('YOUR-PROJECT') || SUPABASE_ANON_KEY.includes('YOUR-ANON')){
    status.textContent = 'Supabase 설정이 필요합니다 (supabase-config.js).';
    status.classList.add('err');
    return;
  }
  await renderView();
  status.innerHTML = '<span class="live-dot"></span>실시간 연결됨';
  subscribeTeam(TEAM, renderView);
})();
</script>
</body>
</html>
