<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생산1팀 · 원료 주간 입고 계획</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2F1EC; --paper-raised:#FAF9F5; --ink:#25272B; --ink-soft:#6B6E73;
    --line:#DBD8CE; --line-strong:#C7C3B6; --accent:#B8763A; --total-bg:#EFE7DA;
    --shadow: 0 1px 2px rgba(37,39,43,0.06), 0 4px 14px rgba(37,39,43,0.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans KR',sans-serif;}
  body{padding:26px 18px 60px;min-height:100vh;}
  .wrap{max-width:900px;margin:0;}
  h1{font-family:'Noto Serif KR',serif;font-weight:700;font-size:22px;margin:0;}
  .sub{font-size:13px;color:var(--ink-soft);margin:8px 0 4px;}
  .live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#5C7A52;margin-right:6px;}
  .conn-status{font-size:11px;color:var(--ink-soft);margin-bottom:22px;}
  .conn-status.err{color:#B0453C;}
  .team-block{background:var(--paper-raised);border:1px solid var(--line);border-radius:10px;
    padding:16px 16px 14px;box-shadow:var(--shadow);width:fit-content;}
  table{width:auto;border-collapse:collapse;font-size:13px;table-layout:fixed;}
  th,td{border:1px solid var(--line);padding:6px 3px;text-align:center;}
  th{background:#EFEDE5;font-weight:500;color:var(--ink);font-size:12px;white-space:nowrap;}
  col.col-name{width:112px;} col.col-day{width:30px;} col.col-total{width:38px;}
  td.mat-name{text-align:left;padding:6px 4px 6px 10px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  td.cell{font-size:12.5px;} td.cell .v{display:block;line-height:1.5;}
  td.total{background:var(--total-bg);font-weight:700;color:var(--accent);}
  .empty{font-size:13px;color:var(--ink-soft);}
  @media (max-width:640px){ table{font-size:11.5px;} th,td{padding:4px 2px;} td.mat-name{padding-left:5px;} h1{font-size:18px;} }
</style>
</head>
<body>
<div class="wrap">
  <h1>원료 주간 입고 계획</h1>
  <div class="sub" id="weekLabel"></div>
  <div class="conn-status" id="connStatus"><span class="live-dot"></span>실시간 연결 중...</div>
  <div class="team-block">
    <div id="content"><div class="empty">불러오는 중...</div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="app-shared.js"></script>
<script>
const TEAM = 'team1';
let monday = getMonday(new Date());

async function renderView(){
  document.getElementById('weekLabel').textContent = weekLabelText(monday);
  const materials = await fetchMaterials(TEAM);
  const rows = await fetchEntries(TEAM, weekKey(monday));
  const grouped = groupEntries(rows);

  let html = '<table><colgroup><col class="col-name">';
  for(let i=0;i<6;i++) html += '<col class="col-day">';
  html += '<col class="col-total"></colgroup><thead><tr><th style="text-align:left;padding-left:10px;">원료명</th>';
  for(let i=0;i<6;i++){
    const d = dayDate(monday, i);
    html += `<th>${fmtDayOnly(d)}(${WEEKDAYS[i]})</th>`;
  }
  html += '<th>합계</th></tr></thead><tbody>';

  materials.forEach(m=>{
    html += `<tr><td class="mat-name">${escapeHtml(m.name)}</td>`;
    for(let i=0;i<6;i++){
      const es = (grouped[m.name] && grouped[m.name][i]) || [];
      const c = es.length ? es.map(e=>`<span class="v">${e.amount}</span>`).join('') : '';
      html += `<td class="cell">${c}</td>`;
    }
    html += `<td class="total">${sumForMaterial(grouped, m.name)}</td></tr>`;
  });
  html += '</tbody></table>';
  document.getElementById('content').innerHTML = html;
}

(async function init(){
  const status = document.getElementById('connStatus');
  if(SUPABASE_URL.includes('YOUR-PROJECT') || SUPABASE_ANON_KEY.includes('YOUR-ANON')){
    status.textContent = 'Supabase 설정이 필요합니다 (supabase-config.js).';
    status.classList.add('err');
    return;
  }
  await renderView();
  status.innerHTML = '<span class="live-dot"></span>실시간 연결됨';
  subscribeTeam(TEAM, renderView);
})();
</script>
</body>
</html>
